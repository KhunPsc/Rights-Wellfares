<!-- @title คู่มือตรวจจ่ายค่ารักษาพยาบาล (44 ข้อ) -->
<main class="app-main max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Search + Controls -->
    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3 mb-6">
        <div class="relative flex-1 lg:max-w-xl">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input
                id="globalSearchInput"
                type="text"
                inputmode="search"
                enterkeyhint="search"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                aria-label="ค้นหาข้อมูลในคู่มือ"
                placeholder="ค้นหา เช่น ค่าห้อง, ลูกจ้าง, 90 วัน, ล้างไต, เบี้ยเลี้ยง..."
                class="w-full min-w-0 pl-10 pr-9 py-2.5 rounded-xl bg-white text-slate-900 placeholder-slate-400 text-base sm:text-sm border border-slate-300 focus:border-pea-600 focus:outline-none transition"
            >
            <button
                id="clearSearchBtn"
                onclick="clearSearch()"
                class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1"
                title="ล้างคำค้นหา"
            >
                <i class="fa-solid fa-circle-xmark"></i>
            </button>
        </div>

        <!-- Expand / Collapse All Controls -->
        <div id="manualControls" class="flex flex-wrap items-center gap-2 text-xs">
            <span id="clauseCounterBadge" class="px-3 py-1.5 rounded-xl bg-purple-100 text-pea-800 font-heading font-semibold">
                กำลังโหลด...
            </span>
            <button onclick="toggleAllClauses(true)" class="px-3 py-1.5 rounded-xl bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium transition">
                <i class="fa-solid fa-angles-down mr-1"></i>ขยายทั้งหมด
            </button>
            <button onclick="toggleAllClauses(false)" class="px-3 py-1.5 rounded-xl bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium transition">
                <i class="fa-solid fa-angles-up mr-1"></i>ย่อทั้งหมด
            </button>
        </div>
    </div>

    <div id="viewManual" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- Left Sidebar -->
        <aside class="lg:col-span-4 xl:col-span-3 space-y-4">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 lg:sticky lg:top-20">
                <h2 class="font-heading font-bold text-sm text-slate-800 uppercase tracking-wider mb-3 flex items-center justify-between">
                    <span><i class="fa-solid fa-layer-group text-pea-600 mr-1.5"></i>หมวดหมู่เนื้อหา</span>
                    <span id="categoryCountLabel" class="text-xs font-normal text-slate-400"></span>
                </h2>
                <nav id="categoryNavList" class="space-y-1.5">
                    <!-- Populated dynamically via JS -->
                </nav>

                <div id="formsSection" class="hidden">
                    <hr class="my-4 border-slate-200">
                    <h3 class="font-heading font-semibold text-xs text-slate-700 mb-2 flex items-center justify-between">
                        <span><i class="fa-solid fa-download text-pea-600 mr-1"></i>Download แบบฟอร์ม</span>
                        <a href="forms.html" class="text-[10px] font-heading text-pea-700 hover:text-pea-900 transition flex items-center gap-0.5 no-underline">
                            <span>ดูทั้งหมด</span>
                            <i class="fa-solid fa-chevron-right text-[8px]"></i>
                        </a>
                    </h3>
                    <div id="formsList" class="space-y-2"></div>
                </div>
            </div>
        </aside>

        <!-- Right Content: Clauses List -->
        <section class="lg:col-span-8 xl:col-span-9 space-y-4">
            <!-- Active Category Banner -->
            <div id="activeCategoryHeader" class="bg-gradient-to-r from-pea-800 to-purple-700 rounded-2xl p-5 text-white shadow-sm">
                <span id="activeCatBadge" class="px-2.5 py-0.5 rounded-full text-xs font-heading bg-white/20 text-amber-200">หมวดทั้งหมด</span>
                <h2 id="activeCatTitle" class="text-lg sm:text-xl font-heading font-bold mt-1">สารบัญครบทุกข้อตามคู่มือตรวจจ่ายค่ารักษาพยาบาล และอัตราเบี้ยเลี้ยง-ที่พัก</h2>
                <p id="activeCatDesc" class="text-xs sm:text-sm text-purple-100 mt-0.5">คลิกที่แต่ละหัวข้อเพื่อดูรายละเอียด หลักเกณฑ์ ตัวอย่าง และเอกสารประกอบการเบิกจ่าย</p>
            </div>

            <!-- Clauses Container -->
            <div id="clausesContainer" class="space-y-3.5"></div>

            <!-- Pagination -->
            <nav id="clausePager" class="flex flex-wrap items-center justify-center gap-1.5 pt-2"></nav>
        </section>
    </div>
</main>
