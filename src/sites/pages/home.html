<!-- @title หน้าแรก - คู่มือตรวจจ่ายค่ารักษาพยาบาล และอัตราเบี้ยเลี้ยง-ที่พัก (กฟภ.) -->
<main class="app-main max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- News Feed / Announcement Banner Carousel with Owl Dots -->
    <section id="newsFeedSection" class="relative bg-gradient-to-br from-slate-900 via-purple-950 to-pea-950 rounded-3xl p-5 sm:p-6 text-white shadow-xl border border-white/10 overflow-hidden group">
        <!-- Background decorative ambient glow -->
        <div class="absolute -right-16 -top-16 w-64 h-64 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -left-16 -bottom-16 w-64 h-64 bg-pea-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header bar: Badge and Page Counter -->
        <div class="relative z-10 flex items-center justify-between gap-3 mb-3">
            <div class="flex items-center gap-2">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 font-heading font-bold text-xs shadow-sm">
                    <i class="fa-solid fa-bullhorn text-xs animate-bounce"></i>
                    <span>ข่าวสารและระเบียบล่าสุด</span>
                </span>
                <span id="newsSlideBadge" class="hidden sm:inline-block px-2.5 py-0.5 rounded-full text-[11px] font-heading font-medium bg-white/10 text-purple-200 border border-white/10">
                    ประกาศ
                </span>
            </div>
            <!-- Slide Counter and Progress -->
            <div class="flex items-center gap-2 text-xs text-purple-200 font-heading">
                <span id="newsSlideCounter" class="bg-white/10 px-2 py-0.5 rounded-lg border border-white/10">1 / 1</span>
            </div>
        </div>

        <!-- Slide Content Wrapper with Navigation Chevrons -->
        <div class="relative z-10 flex items-center gap-2 sm:gap-4">
            <!-- Prev Button -->
            <button
                type="button"
                id="newsPrevBtn"
                onclick="prevNewsSlide()"
                class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 text-white flex items-center justify-center shrink-0 transition border border-white/10 shadow-sm cursor-pointer"
                title="ข่าวก่อนหน้า"
            >
                <i class="fa-solid fa-chevron-left text-xs sm:text-sm"></i>
            </button>

            <!-- Active Slide Card (Transitions smoothly) -->
            <div id="newsSlideContainer" class="flex-1 min-w-0 transition-opacity duration-300">
                <div id="newsSlideContent" class="space-y-2">
                    <div class="animate-pulse space-y-2 py-2">
                        <div class="h-4 bg-white/10 rounded w-1/4"></div>
                        <div class="h-6 bg-white/20 rounded w-3/4"></div>
                        <div class="h-4 bg-white/10 rounded w-full"></div>
                    </div>
                </div>
            </div>

            <!-- Next Button -->
            <button
                type="button"
                id="newsNextBtn"
                onclick="nextNewsSlide()"
                class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 text-white flex items-center justify-center shrink-0 transition border border-white/10 shadow-sm cursor-pointer"
                title="ข่าวถัดไป"
            >
                <i class="fa-solid fa-chevron-right text-xs sm:text-sm"></i>
            </button>
        </div>

        <!-- Owl Dots (Indicators) -->
        <div id="newsOwlDots" class="relative z-10 flex items-center justify-center gap-2 pt-4">
            <!-- Dynamic owl dots rendered here -->
        </div>
    </section>

    <!-- Search Bar Section (Home Page) -->
    <section class="w-full">
        <form onsubmit="handleHomeSearch(event)" class="relative w-full">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-base pointer-events-none"></i>
            <input
                id="globalSearchInput"
                type="text"
                inputmode="search"
                enterkeyhint="search"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                aria-label="ค้นหาในหนังสือทุกเล่ม"
                placeholder="ค้นหา เช่น ค่าห้อง, ลูกจ้าง, 90 วัน, ล้างไต, เบี้ยเลี้ยง, ปากกาลดน้ำหนัก..."
                class="w-full min-w-0 pl-11 pr-24 py-3 sm:py-3.5 rounded-2xl bg-white text-slate-900 placeholder-slate-400 text-base sm:text-sm border border-slate-300 focus:border-pea-600 focus:ring-4 focus:ring-purple-100 focus:outline-none shadow-sm transition"
            >
            <div class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center gap-1.5">
                <button
                    id="clearSearchBtn"
                    type="button"
                    onclick="clearHomeSearch()"
                    class="hidden text-slate-400 hover:text-slate-600 p-1.5 transition cursor-pointer"
                    title="ล้างคำค้นหา"
                >
                    <i class="fa-solid fa-circle-xmark text-sm"></i>
                </button>
                <button
                    type="submit"
                    class="px-4 py-2 sm:py-2.5 rounded-xl bg-pea-700 hover:bg-pea-800 text-white font-heading font-semibold text-xs sm:text-sm transition flex items-center gap-1.5 shadow-sm cursor-pointer active:scale-95"
                >
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    <span>ค้นหา</span>
                </button>
            </div>
        </form>
        <div id="homeSearchResults" class="hidden mt-3 bg-white rounded-2xl border border-slate-200 shadow-sm"></div>
    </section>

    <!-- เข้าตามเหตุการณ์: การ์ดจาก src/data/highlights.json → บทในหนังสือ -->
    <section>
        <div class="flex items-center justify-between mb-3">
            <h2 class="font-heading font-bold text-base text-slate-800"><i class="fa-solid fa-compass text-pea-600 mr-1.5"></i>เกิดอะไรขึ้นกับคุณ?</h2>
            <span class="text-xs text-slate-500">เลือกเรื่องเพื่อเปิดอ่านบทที่เกี่ยวข้อง</span>
        </div>
        <div id="homeHighlights" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3" aria-busy="true">
            <!-- skeleton จนกว่า JS จะเติมข้อมูล -->
            <div class="p-3 rounded-xl border border-slate-200 bg-white flex items-start gap-2.5 motion-safe:animate-pulse" aria-hidden="true"><span class="w-9 h-9 shrink-0 rounded-lg bg-slate-200"></span><span class="flex-1 space-y-2 pt-1"><span class="block h-3.5 w-3/4 rounded bg-slate-200"></span><span class="block h-3 w-full rounded bg-slate-200/70"></span></span></div><div class="p-3 rounded-xl border border-slate-200 bg-white flex items-start gap-2.5 motion-safe:animate-pulse" aria-hidden="true"><span class="w-9 h-9 shrink-0 rounded-lg bg-slate-200"></span><span class="flex-1 space-y-2 pt-1"><span class="block h-3.5 w-3/4 rounded bg-slate-200"></span><span class="block h-3 w-full rounded bg-slate-200/70"></span></span></div><div class="p-3 rounded-xl border border-slate-200 bg-white flex items-start gap-2.5 motion-safe:animate-pulse" aria-hidden="true"><span class="w-9 h-9 shrink-0 rounded-lg bg-slate-200"></span><span class="flex-1 space-y-2 pt-1"><span class="block h-3.5 w-3/4 rounded bg-slate-200"></span><span class="block h-3 w-full rounded bg-slate-200/70"></span></span></div><div class="p-3 rounded-xl border border-slate-200 bg-white flex items-start gap-2.5 motion-safe:animate-pulse" aria-hidden="true"><span class="w-9 h-9 shrink-0 rounded-lg bg-slate-200"></span><span class="flex-1 space-y-2 pt-1"><span class="block h-3.5 w-3/4 rounded bg-slate-200"></span><span class="block h-3 w-full rounded bg-slate-200/70"></span></span></div><div class="p-3 rounded-xl border border-slate-200 bg-white flex items-start gap-2.5 motion-safe:animate-pulse" aria-hidden="true"><span class="w-9 h-9 shrink-0 rounded-lg bg-slate-200"></span><span class="flex-1 space-y-2 pt-1"><span class="block h-3.5 w-3/4 rounded bg-slate-200"></span><span class="block h-3 w-full rounded bg-slate-200/70"></span></span></div><div class="p-3 rounded-xl border border-slate-200 bg-white flex items-start gap-2.5 motion-safe:animate-pulse" aria-hidden="true"><span class="w-9 h-9 shrink-0 rounded-lg bg-slate-200"></span><span class="flex-1 space-y-2 pt-1"><span class="block h-3.5 w-3/4 rounded bg-slate-200"></span><span class="block h-3 w-full rounded bg-slate-200/70"></span></span></div><div class="p-3 rounded-xl border border-slate-200 bg-white flex items-start gap-2.5 motion-safe:animate-pulse" aria-hidden="true"><span class="w-9 h-9 shrink-0 rounded-lg bg-slate-200"></span><span class="flex-1 space-y-2 pt-1"><span class="block h-3.5 w-3/4 rounded bg-slate-200"></span><span class="block h-3 w-full rounded bg-slate-200/70"></span></span></div><div class="p-3 rounded-xl border border-slate-200 bg-white flex items-start gap-2.5 motion-safe:animate-pulse" aria-hidden="true"><span class="w-9 h-9 shrink-0 rounded-lg bg-slate-200"></span><span class="flex-1 space-y-2 pt-1"><span class="block h-3.5 w-3/4 rounded bg-slate-200"></span><span class="block h-3 w-full rounded bg-slate-200/70"></span></span></div>
        </div>
    </section>

    <!-- Book Shelf: หนังสือคู่มือ (เพิ่มเล่มใน src/data/books.json) -->
    <section>
        <div class="flex items-center justify-between mb-3">
            <h2 class="font-heading font-bold text-base text-slate-800"><i class="fa-solid fa-book-bookmark text-pea-600 mr-1.5"></i>ชั้นหนังสือคู่มือ</h2>
            <span class="text-xs text-slate-500">เลือกเล่มเพื่อเปิดสารบัญ</span>
        </div>
        <div id="homeBookShelf" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 sm:gap-5" aria-busy="true">
            <!-- skeleton จนกว่า JS จะเติมข้อมูล -->
            <div class="aspect-[3/4] rounded-r-2xl rounded-l-md bg-gradient-to-br from-purple-200 to-purple-100 p-5 flex flex-col motion-safe:animate-pulse" aria-hidden="true"><span class="w-11 h-11 rounded-xl bg-white/50"></span><span class="mt-4 h-4 w-1/3 rounded-full bg-white/60"></span><span class="mt-3 h-5 w-4/5 rounded bg-white/60"></span><span class="mt-2 h-5 w-3/5 rounded bg-white/60"></span><span class="mt-auto h-3 w-full rounded bg-white/50"></span></div><div class="aspect-[3/4] rounded-r-2xl rounded-l-md bg-gradient-to-br from-purple-200 to-purple-100 p-5 flex flex-col motion-safe:animate-pulse" aria-hidden="true"><span class="w-11 h-11 rounded-xl bg-white/50"></span><span class="mt-4 h-4 w-1/3 rounded-full bg-white/60"></span><span class="mt-3 h-5 w-4/5 rounded bg-white/60"></span><span class="mt-2 h-5 w-3/5 rounded bg-white/60"></span><span class="mt-auto h-3 w-full rounded bg-white/50"></span></div>
        </div>
    </section>

</main>
