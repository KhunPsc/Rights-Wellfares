<!-- @title หน้าแรก - คู่มือตรวจจ่ายค่ารักษาพยาบาล และอัตราเบี้ยเลี้ยง-ที่พัก (กฟภ.) -->
<main class="app-main max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- งานหลักของหน้า: ค้นหาในหนังสือทุกเล่ม -->
    <section>
        <h1 class="rw-title">ค้นหาสิทธิและสวัสดิการ</h1>
        <p class="mt-1 text-sm text-slate-600">ค้นได้ในคู่มือทุกเล่ม หรือเลือกเรื่องที่สงสัยด้านล่าง</p>
        <div class="rw-band mt-3 mb-4" aria-hidden="true"></div>
        <form onsubmit="handleHomeSearch(event)" class="relative w-full">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-base pointer-events-none"></i>
            <input
                id="globalSearchInput"
                type="text"
                inputmode="search"
                enterkeyhint="search"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                aria-label="ค้นหาในหนังสือทุกเล่ม"
                placeholder="เช่น ค่าห้อง, ลูกจ้าง, 90 วัน, ล้างไต, เบี้ยเลี้ยง"
                class="w-full min-w-0 pl-11 pr-24 py-3.5 sm:py-4 rounded-xl bg-white text-slate-900 placeholder-slate-400 text-base border-2 border-slate-300 focus:border-pea-700 focus:outline-none transition-colors"
            >
            <div class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center gap-1.5">
                <button
                    id="clearSearchBtn"
                    type="button"
                    onclick="clearHomeSearch()"
                    class="hidden text-slate-400 hover:text-slate-600 p-1.5 transition cursor-pointer"
                    title="ล้างคำค้นหา"
                >
                    <i class="fa-solid fa-circle-xmark text-sm"></i>
                </button>
                <button
                    type="submit"
                    class="px-4 py-2.5 rounded-lg bg-pea-700 hover:bg-pea-800 text-white font-heading font-semibold text-sm transition-colors cursor-pointer"
                >ค้นหา</button>
            </div>
        </form>
        <div id="homeSearchResults" class="hidden mt-3 bg-white rounded-xl border border-slate-200"></div>
    </section>

    <!-- ข่าวระเบียบล่าสุด: แถบเดียว เลื่อนเองด้วยปุ่ม (src/data/news.json) -->
    <section id="newsFeedSection" class="flex items-stretch gap-3 bg-white rounded-xl border border-slate-200 border-l-4 border-l-amber-400 pl-4 pr-2 py-3" aria-label="ข่าวระเบียบล่าสุด">
        <div id="newsSlideContent" class="flex-1 min-w-0">
            <div class="motion-safe:animate-pulse space-y-2 py-1" aria-hidden="true">
                <div class="h-3 bg-slate-200 rounded w-1/4"></div>
                <div class="h-4 bg-slate-200 rounded w-3/4"></div>
            </div>
        </div>
        <div class="shrink-0 flex items-center gap-1 self-center">
            <button type="button" id="newsPrevBtn" onclick="prevNewsSlide()" class="w-8 h-8 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-pea-800 flex items-center justify-center transition-colors cursor-pointer" title="ข่าวก่อนหน้า" aria-label="ข่าวก่อนหน้า"><i class="fa-solid fa-chevron-left text-xs"></i></button>
            <span id="newsSlideCounter" class="text-xs text-slate-500 font-heading tabular-nums min-w-[2.5rem] text-center">1/1</span>
            <button type="button" id="newsNextBtn" onclick="nextNewsSlide()" class="w-8 h-8 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-pea-800 flex items-center justify-center transition-colors cursor-pointer" title="ข่าวถัดไป" aria-label="ข่าวถัดไป"><i class="fa-solid fa-chevron-right text-xs"></i></button>
        </div>
    </section>

    <!-- เข้าตามเหตุการณ์: การ์ดจาก src/data/highlights.json → บทในหนังสือ -->
    <section>
        <div class="flex items-center justify-between mb-3">
            <h2 class="font-heading font-bold text-lg text-pea-900">กำลังสงสัยเรื่องอะไรอยู่รึเปล่า?</h2>
        </div>
        <div id="homeHighlights" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3" aria-busy="true">
            <!-- skeleton จนกว่า JS จะเติมข้อมูล -->
            <div class="p-3 rounded-xl border border-slate-200 bg-white flex items-start gap-2.5 motion-safe:animate-pulse" aria-hidden="true"><span class="w-9 h-9 shrink-0 rounded-lg bg-slate-200"></span><span class="flex-1 space-y-2 pt-1"><span class="block h-3.5 w-3/4 rounded bg-slate-200"></span><span class="block h-3 w-full rounded bg-slate-200/70"></span></span></div><div class="p-3 rounded-xl border border-slate-200 bg-white flex items-start gap-2.5 motion-safe:animate-pulse" aria-hidden="true"><span class="w-9 h-9 shrink-0 rounded-lg bg-slate-200"></span><span class="flex-1 space-y-2 pt-1"><span class="block h-3.5 w-3/4 rounded bg-slate-200"></span><span class="block h-3 w-full rounded bg-slate-200/70"></span></span></div><div class="p-3 rounded-xl border border-slate-200 bg-white flex items-start gap-2.5 motion-safe:animate-pulse" aria-hidden="true"><span class="w-9 h-9 shrink-0 rounded-lg bg-slate-200"></span><span class="flex-1 space-y-2 pt-1"><span class="block h-3.5 w-3/4 rounded bg-slate-200"></span><span class="block h-3 w-full rounded bg-slate-200/70"></span></span></div><div class="p-3 rounded-xl border border-slate-200 bg-white flex items-start gap-2.5 motion-safe:animate-pulse" aria-hidden="true"><span class="w-9 h-9 shrink-0 rounded-lg bg-slate-200"></span><span class="flex-1 space-y-2 pt-1"><span class="block h-3.5 w-3/4 rounded bg-slate-200"></span><span class="block h-3 w-full rounded bg-slate-200/70"></span></span></div><div class="p-3 rounded-xl border border-slate-200 bg-white flex items-start gap-2.5 motion-safe:animate-pulse" aria-hidden="true"><span class="w-9 h-9 shrink-0 rounded-lg bg-slate-200"></span><span class="flex-1 space-y-2 pt-1"><span class="block h-3.5 w-3/4 rounded bg-slate-200"></span><span class="block h-3 w-full rounded bg-slate-200/70"></span></span></div><div class="p-3 rounded-xl border border-slate-200 bg-white flex items-start gap-2.5 motion-safe:animate-pulse" aria-hidden="true"><span class="w-9 h-9 shrink-0 rounded-lg bg-slate-200"></span><span class="flex-1 space-y-2 pt-1"><span class="block h-3.5 w-3/4 rounded bg-slate-200"></span><span class="block h-3 w-full rounded bg-slate-200/70"></span></span></div><div class="p-3 rounded-xl border border-slate-200 bg-white flex items-start gap-2.5 motion-safe:animate-pulse" aria-hidden="true"><span class="w-9 h-9 shrink-0 rounded-lg bg-slate-200"></span><span class="flex-1 space-y-2 pt-1"><span class="block h-3.5 w-3/4 rounded bg-slate-200"></span><span class="block h-3 w-full rounded bg-slate-200/70"></span></span></div><div class="p-3 rounded-xl border border-slate-200 bg-white flex items-start gap-2.5 motion-safe:animate-pulse" aria-hidden="true"><span class="w-9 h-9 shrink-0 rounded-lg bg-slate-200"></span><span class="flex-1 space-y-2 pt-1"><span class="block h-3.5 w-3/4 rounded bg-slate-200"></span><span class="block h-3 w-full rounded bg-slate-200/70"></span></span></div>
        </div>
    </section>

    <!-- Book Shelf: หนังสือคู่มือ (เพิ่มเล่มใน src/data/books.json) -->
    <section>
        <div class="flex items-center justify-between mb-3">
            <h2 class="font-heading font-bold text-lg text-pea-900">ชั้นหนังสือคู่มือ</h2>
        </div>
        <div id="homeBookShelf" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 sm:gap-5" aria-busy="true">
            <!-- skeleton จนกว่า JS จะเติมข้อมูล -->
            <div class="aspect-[3/4] rounded-r-2xl rounded-l-md bg-gradient-to-b from-white from-40% to-purple-100 to-40% border border-slate-200 p-5 flex flex-col motion-safe:animate-pulse" aria-hidden="true"><span class="w-11 h-11 rounded-xl bg-slate-100"></span><span class="mt-auto h-4 w-1/3 rounded-full bg-white/60"></span><span class="mt-3 h-5 w-4/5 rounded bg-white/60"></span><span class="mt-2 h-5 w-3/5 rounded bg-white/60"></span><span class="mt-auto h-3 w-full rounded bg-white/50"></span></div><div class="aspect-[3/4] rounded-r-2xl rounded-l-md bg-gradient-to-b from-white from-40% to-purple-100 to-40% border border-slate-200 p-5 flex flex-col motion-safe:animate-pulse" aria-hidden="true"><span class="w-11 h-11 rounded-xl bg-slate-100"></span><span class="mt-auto h-4 w-1/3 rounded-full bg-white/60"></span><span class="mt-3 h-5 w-4/5 rounded bg-white/60"></span><span class="mt-2 h-5 w-3/5 rounded bg-white/60"></span><span class="mt-auto h-3 w-full rounded bg-white/50"></span></div>
        </div>
    </section>

</main>
