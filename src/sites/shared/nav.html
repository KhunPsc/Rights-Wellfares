<script>
(function () {
    var page = (window.RW_CONFIG || {}).page;
    // หน้า book เป็นส่วนหนึ่งของชั้นหนังสือ
    var current = page === 'book' ? 'home' : page;
    document.querySelectorAll('#rwNav [data-nav="' + current + '"]').forEach(function (a) {
        a.classList.remove('text-slate-600', 'text-slate-700');
        a.classList.add('bg-purple-50', 'text-pea-800', 'font-semibold');
        a.setAttribute('aria-current', 'page');
    });
    if (page === 'home') document.querySelector('#rwNav [data-nav-back]').remove();
})();
</script>
