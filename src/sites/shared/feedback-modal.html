<!-- Shared Feedback / Report Modal -->
<div id="rwFeedbackModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 no-print">
    <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-lg overflow-hidden animate-in fade-in zoom-in-95 duration-200">
        <div class="bg-pea-800 text-white px-5 py-4 flex items-center justify-between border-b-2 border-amber-400">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-amber-400 text-slate-900 flex items-center justify-center font-bold">
                    <i class="fa-solid fa-comment-dots"></i>
                </div>
                <div>
                    <h3 class="font-heading font-bold text-base">แจ้งข้อเสนอแนะ / แจ้งปัญหา</h3>
                    <p class="text-xs text-purple-200">ข้อมูลจะถูกส่งให้ผู้จัดทำเพื่อการปรับปรุงคู่มือ</p>
                </div>
            </div>
            <button type="button" onclick="RW.closeFeedback()" class="w-8 h-8 rounded-lg hover:bg-white/15 text-purple-200 hover:text-white flex items-center justify-center transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <form id="rwFeedbackForm" onsubmit="RW.submitFeedback(event)" class="p-5 space-y-4">
            <div>
                <label class="block text-xs font-heading font-semibold text-slate-700 mb-1">ประเภทการแจ้ง <span class="text-rose-500">*</span></label>
                <select id="rwFbType" required class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm focus:border-pea-600 focus:outline-none">
                    <option value="แจ้งข้อมูลไม่ถูกต้อง / ข้อระเบียบคลาดเคลื่อน">แจ้งข้อมูลไม่ถูกต้อง / ข้อระเบียบคลาดเคลื่อน</option>
                    <option value="เสนอแนะเพิ่มเติม / ปรับปรุงระบบ">เสนอแนะเพิ่มเติม / ปรับปรุงระบบ</option>
                    <option value="แจ้งปัญหาการใช้งานเว็บไซต์ / AI">แจ้งปัญหาการใช้งานเว็บไซต์ / AI</option>
                    <option value="อื่นๆ">อื่นๆ</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-heading font-semibold text-slate-700 mb-1">รายละเอียด / ข้อเสนอแนะ <span class="text-rose-500">*</span></label>
                <textarea id="rwFbDetail" required rows="4" placeholder="ระบุรายละเอียด เช่น ข้อที่พบว่าคลาดเคลื่อน หรือคำแนะนำเพิ่มเติม..." class="w-full rounded-xl border border-slate-300 p-3 text-sm focus:border-pea-600 focus:outline-none"></textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-heading font-semibold text-slate-700 mb-1">ชื่อ - นามสกุล / สังกัด (ไม่บังคับ)</label>
                    <input type="text" id="rwFbSender" placeholder="เช่น นายขุนพล / ผสน.กฟส.จอมทอง" class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-pea-600 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-heading font-semibold text-slate-700 mb-1">เบอร์โทรติดต่อ / อีเมล (ไม่บังคับ)</label>
                    <input type="text" id="rwFbContact" placeholder="เบอร์โทรหรืออีเมล" class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm focus:border-pea-600 focus:outline-none">
                </div>
            </div>

            <div id="rwFbAlertBox" class="hidden p-3 rounded-xl text-xs"></div>

            <div class="flex items-center justify-end gap-2.5 pt-2 border-t border-slate-100">
                <button type="button" onclick="RW.closeFeedback()" class="px-4 py-2.5 rounded-xl border border-slate-300 hover:bg-slate-50 text-slate-700 font-heading font-semibold text-sm transition">
                    ยกเลิก
                </button>
                <button type="submit" id="rwFbSubmitBtn" class="px-5 py-2.5 rounded-xl bg-pea-700 hover:bg-pea-800 text-white font-heading font-semibold text-sm shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>ยืนยัน ส่งข้อมูล</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Shared Image Lightbox Modal -->
<div id="rwImageModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden flex flex-col items-center justify-center p-3 sm:p-6 no-print" onclick="if(event.target === this) RW.closeImageModal()">
    <div class="relative max-w-4xl max-h-[92vh] w-full flex flex-col bg-slate-900 rounded-3xl overflow-hidden shadow-2xl border border-white/10 animate-in fade-in zoom-in-95 duration-200">
        <div class="flex items-center justify-between px-4 py-3 bg-slate-900/95 border-b border-white/10 text-white">
            <div id="rwImageModalTitle" class="text-sm font-heading font-medium truncate pr-4 text-slate-200">รูปภาพประกอบ</div>
            <div class="flex items-center gap-2">
                <a id="rwImageModalDownload" href="#" download target="_blank" class="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-xs text-white transition flex items-center gap-1.5">
                    <i class="fa-solid fa-download"></i><span>ดาวน์โหลด</span>
                </a>
                <button type="button" onclick="RW.closeImageModal()" class="w-8 h-8 rounded-lg hover:bg-white/20 text-slate-300 hover:text-white flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
        </div>
        <div class="flex-1 overflow-auto p-2 sm:p-4 flex items-center justify-center bg-slate-950/50">
            <img id="rwImageModalImg" src="" alt="ขยายรูปภาพ" class="max-h-[78vh] w-auto max-w-full rounded-xl object-contain shadow-lg cursor-zoom-out" onclick="RW.closeImageModal()">
        </div>
    </div>
</div>
