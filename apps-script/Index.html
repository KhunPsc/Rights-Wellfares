<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #f7f7f8; --surface: #fff; --text: #1f2328; --muted: #6b7280;
      --accent: #1d6f5f; --accent-text: #fff; --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c; --surface: #1f2328; --text: #e6e6e6; --muted: #9ca3af;
        --accent: #3aa58e; --accent-text: #0b1512; --border: #30363d;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
    }
    #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
    .user { align-self: flex-end; background: var(--accent); color: var(--accent-text); border-bottom-right-radius: 4px; }
    .assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .error { align-self: center; color: #c0392b; font-size: 14px; }
    .typing { color: var(--muted); font-style: italic; }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--surface); }
    textarea {
      flex: 1; resize: none; font: inherit; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text); max-height: 120px;
    }
    button { font: inherit; padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-text); cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <div id="log">
    <div class="msg assistant">สวัสดีครับ สอบถามเรื่องสิทธิและสวัสดิการได้เลย</div>
  </div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="พิมพ์คำถาม..." required></textarea>
    <button id="send" type="submit">ส่ง</button>
  </form>

  <script>
    const history = [];
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    function add(cls, text) {
      const el = document.createElement('div');
      el.className = 'msg ' + cls;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    function setBusy(busy) {
      send.disabled = busy;
      input.disabled = busy;
      if (!busy) input.focus();
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      add('user', text);
      history.push({ role: 'user', content: text });
      const typing = add('assistant typing', 'กำลังพิมพ์...');
      setBusy(true);

      google.script.run
        .withSuccessHandler((reply) => {
          typing.remove();
          add('assistant', reply);
          history.push({ role: 'assistant', content: reply });
          setBusy(false);
        })
        .withFailureHandler((err) => {
          typing.remove();
          history.pop();
          add('error', err.message || 'เกิดข้อผิดพลาด');
          setBusy(false);
        })
        .chat(history);
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
